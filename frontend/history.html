<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis History</title>
    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
    <header class="topbar">
        <h2>Resume Analyzer</h2>
        <nav>
            <a href="/dashboard">Analyze</a>
            <a href="/history">History</a>
            <button id="logoutButton">Logout</button>
        </nav>
    </header>

    <main class="container">
        <h1>Your analysis history</h1>
        <p id="status" role="status">Loading history...</p>
        <div id="historyList"></div>

        <section id="details" class="panel" hidden>
            <h2 id="detailTitle"></h2>
            <p id="detailScore"></p>

            <h3>Matching skills</h3>
            <ul id="detailMatched"></ul>

            <h3>Skills not found</h3>
            <ul id="detailMissing"></ul>

            <h3>Suggestions</h3>
            <ul id="detailSuggestions"></ul>

            <h3>Summary</h3>
            <p id="detailSummary"></p>
        </section>
    </main>

    <script src="/frontend/history.js"></script>
</body>
</html>
